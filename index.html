<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSNMUN 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bokor&family=Sancreek&family=Splash&family=Viaoda+Libre&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --ink: #c8d8e8;
            --ink-mid: #7a9ab8;
            --bg: #060d16;
            --accent: #4a90d9;
            --accent-light: #6aace8;
            --muted: #3a5a7a;

            --font-title: 'Viaoda Libre', serif;
            --font-sub: 'Splash', cursive;
            --font-heading: 'Bokor', serif;
            --font-label: 'Sancreek', serif;
            --font-body: 'Cormorant Garamond', serif;
            --font-mono: 'Space Mono', monospace;
            --font-reading: 'EB Garamond', serif;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        .msg-eyebrow {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 20px;
        }

        .msg-title {
            font-family: var(--font-title);
            font-size: 3.2rem;
            color: var(--ink);
            letter-spacing: 2px;
            margin-bottom: 0;
        }

        .msg-sub {
            font-family: var(--font-sub);
            font-size: 2rem;
            color: var(--accent);
            letter-spacing: 1px;
            margin-top: -8px;
            margin-bottom: 25px;
        }

        .msg-body {
            font-family: var(--font-reading);
            font-size: 1.25rem;
            color: var(--ink-mid);
            line-height: 1.8;
            max-width: 480px;
            margin: 0 auto 25px;
        }

        .msg-next {
            font-family: var(--font-heading);
            font-size: 1.6rem;
            color: var(--accent-light);
            letter-spacing: 2px;
        }

        @media (max-width: 480px) {
            .msg-title { font-size: 2.2rem; }
            .msg-sub { font-size: 1.5rem; }
            .msg-body { font-size: 1.05rem; }
            .msg-next { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div>
        <p class="msg-eyebrow">Cambridge School Noida</p>
        <h1 class="msg-title">CSNMUN'26</h1>
        <p class="msg-sub">comes to an end.</p>
        <p class="msg-body">Thanks for your participation!</p>
        <p class="msg-next">See you in CSNMUN'27!</p>
    </div>
</body>
</html>
